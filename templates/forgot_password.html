<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SpendSense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ cache_buster }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .forgot-password-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--bg-light);
        }

        .forgot-password-card {
            background: var(--card-white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            max-width: 400px;
            width: 100%;
        }

        .forgot-password-card h1 {
            color: var(--text-heading);
            font-size: 1.5rem;
            margin-bottom: 12px;
            text-align: center;
        }

        .forgot-password-card .description {
            color: var(--text-body);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .forgot-password-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .forgot-password-form input {
            padding: 12px 16px;
            border: 1.5px solid var(--border-light);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            background: var(--card-white);
            color: var(--text-heading);
        }

        .forgot-password-form input:focus {
            outline: none;
            border-color: var(--navy-light);
            box-shadow: 0 0 0 3px rgba(47, 62, 111, 0.1);
        }

        .forgot-password-form button {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--coral-start) 0%, var(--coral-end) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .forgot-password-form button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 106, 77, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--coral-start);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
            font-size: 14px;
        }

        .back-link a:hover {
            color: var(--coral-end);
            text-decoration: underline;
        }

        .success-message {
            display: none;
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <div class="forgot-password-card">
            <h1>Reset Password</h1>
            <p class="description">Enter your email or username to receive password reset instructions.</p>
            
            <div id="successMessage" class="success-message">
                Check your email for password reset instructions.
            </div>
            <div id="errorMessage" class="error-message"></div>

            <form id="forgotPasswordForm" class="forgot-password-form">
                <input 
                    type="text" 
                    id="emailOrUsername" 
                    placeholder="Email or Username" 
                    required
                    autocomplete="off"
                >
                <button type="submit">Send Reset Link</button>
            </form>

            <div class="back-link">
                <a href="/">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Handle dark mode
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const form = document.getElementById('forgotPasswordForm');
        const successMsg = document.getElementById('successMessage');
        const errorMsg = document.getElementById('errorMessage');
        const emailInput = document.getElementById('emailOrUsername');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailOrUsername = emailInput.value.trim();
            
            if (!emailOrUsername) {
                errorMsg.textContent = 'Please enter your email or username';
                errorMsg.classList.add('show');
                return;
            }

            try {
                // This is a placeholder for the actual password reset API
                // In a real implementation, you would send the email/username to a backend endpoint
                // that validates the user and sends a reset link
                
                console.log('Password reset requested for:', emailOrUsername);
                
                // Simulate successful submission
                successMsg.classList.add('show');
                errorMsg.classList.remove('show');
                form.style.opacity = '0.5';
                form.style.pointerEvents = 'none';

                // Reset form after 3 seconds
                setTimeout(() => {
                    form.reset();
                    form.style.opacity = '1';
                    form.style.pointerEvents = 'auto';
                    successMsg.classList.remove('show');
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                errorMsg.textContent = 'An error occurred. Please try again.';
                errorMsg.classList.add('show');
                successMsg.classList.remove('show');
            }
        });

        // Clear error message when user starts typing
        emailInput.addEventListener('input', () => {
            errorMsg.classList.remove('show');
        });
    </script>
</body>
</html>
